name: Release

# A tag cut from a green main: the same gates CI runs, then a GitHub
# release whose notes are the version's CHANGELOG section, carrying the
# packaged .vsix and a CycloneDX SBOM of what it bundles, and a publish of
# that same .vsix to the Visual Studio Code Marketplace and Open VSX (each
# skipped with a warning when its token is not configured).
on:
  push:
    tags: ["v*"]

# Read-only by default; the job that creates the GitHub release widens it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Verify tagged commit is on main
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          git fetch origin main --depth=1
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Release tags (v*) may only be cut from commits merged into origin/main ($GITHUB_SHA is not an ancestor of origin/main)."
            exit 1
          fi
      # The tag must name the version it releases (v0.3.1 tags 0.3.1, nothing
      # else), and that version must have its CHANGELOG section: both are
      # checked before anything is built.
      - name: The tag names the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: node scripts/release.mjs check-tag "$TAG"
      - name: Release notes from the CHANGELOG
        run: node scripts/release.mjs notes > notes.md
      # The packageManager field pins the version; no `version:` needed here.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The packaging gate: a manifest problem (a missing icon, a bad
      # activation event) fails here rather than at the release.
      - run: pnpm exec vsce package --no-dependencies --out "matterwave-${GITHUB_REF_NAME#v}.vsix"
      - name: CycloneDX SBOM of what the .vsix bundles
        run: node scripts/sbom.mjs > "matterwave-${GITHUB_REF_NAME#v}.cdx.json"
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --notes-file notes.md \
            matterwave-*.vsix matterwave-*.cdx.json
      # The registries get the exact file the release carries.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vsix
          path: matterwave-*.vsix

  # Publishes to both registries after the release lands. Two tokens, as
  # repo (or org) secrets:
  #
  #   VSCE_TOKEN -- a Personal Access Token on Azure DevOps (which runs the
  #     Visual Studio Code Marketplace): create it under User Settings >
  #     Personal Access Tokens, scoped to Marketplace > Manage > Publish
  #     for the matterwave publisher.
  #
  #   OVSX_TOKEN -- a Personal Access Token on open-vsx.org: create it
  #     under Settings > Access Tokens for the matterwave namespace.
  #
  # Each publish step checks only its own token and skips with a ::warning
  # when it is absent, so either registry can be wired up on its own.
  marketplace:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The packageManager field pins the version; no `version:` needed here.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: vsix
      - name: Publish to the Visual Studio Code Marketplace
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "::warning::VSCE_TOKEN is not set; skipping the Marketplace publish"
            exit 0
          fi
          pnpm exec vsce publish --packagePath matterwave-*.vsix -p "$VSCE_TOKEN"
      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "::warning::OVSX_TOKEN is not set; skipping the Open VSX publish"
            exit 0
          fi
          npx --yes ovsx publish matterwave-*.vsix -p "$OVSX_TOKEN"
