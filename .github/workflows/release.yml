name: Release

# A tag cut from a green main: the same gates CI runs, then a packaged
# .vsix attached to a GitHub release, and a publish to the Visual Studio
# Code Marketplace and Open VSX (each skipped with a warning when its
# token is not configured).
on:
  push:
    tags: ["v*"]

# Read-only by default; the job that creates the GitHub release widens it.
permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The packageManager field pins the version; no `version:` needed here.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The tag must name the version it releases: v0.3.1 tags 0.3.1, nothing else.
      - name: Check the tag against the manifest version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json's ${version}" >&2
            exit 1
          fi
      # The packaging gate: a manifest problem (a missing icon, a bad
      # activation event) fails here rather than at the release.
      - run: pnpm exec vsce package --no-dependencies --out "matterwave-${GITHUB_REF_NAME#v}.vsix"
      - uses: softprops/action-gh-release@72f2c25fcb47643c292f7107632f7a47c1df5cd8 # v2.3.2
        with:
          files: matterwave-*.vsix
          generate_release_notes: true

  # Publishes to both registries after the release lands. Two tokens, as
  # repo (or org) secrets:
  #
  #   VSCE_TOKEN -- a Personal Access Token on Azure DevOps (which runs the
  #     Visual Studio Code Marketplace): create it under User Settings >
  #     Personal Access Tokens, scoped to Marketplace > Manage > Publish
  #     for the matterwave publisher.
  #
  #   OVSX_TOKEN -- a Personal Access Token on open-vsx.org: create it
  #     under Settings > Access Tokens for the matterwave namespace.
  #
  # Each publish step checks only its own token and skips with a ::warning
  # when it is absent, so either registry can be wired up on its own.
  marketplace:
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # The packageManager field pins the version; no `version:` needed here.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish to the Visual Studio Code Marketplace
        env:
          VSCE_TOKEN: ${{ secrets.VSCE_TOKEN }}
        run: |
          if [ -z "$VSCE_TOKEN" ]; then
            echo "::warning::VSCE_TOKEN is not set; skipping the Marketplace publish"
            exit 0
          fi
          pnpm exec vsce publish --no-dependencies -p "$VSCE_TOKEN"
      - name: Publish to Open VSX
        env:
          OVSX_TOKEN: ${{ secrets.OVSX_TOKEN }}
        run: |
          if [ -z "$OVSX_TOKEN" ]; then
            echo "::warning::OVSX_TOKEN is not set; skipping the Open VSX publish"
            exit 0
          fi
          npx --yes ovsx publish --no-dependencies -p "$OVSX_TOKEN"
