name: CI

on:
  push:
    # develop is where the work lands between releases; main is what ships.
    branches: [main, develop]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The packageManager field pins the version; no `version:` needed here.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The packaging gate: a manifest problem (a missing icon, a bad
      # activation event) fails here rather than at publish time.
      - run: pnpm exec vsce package --no-dependencies --out matterwave.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: matterwave.vsix
          retention-days: 7

  # The extension inside a real VS Code (downloaded by @vscode/test-electron)
  # under a virtual display: the editor suite always runs; the deployment
  # suite runs only where E2E_BASE_URL and the e2e account are configured,
  # and says it was skipped otherwise.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: xvfb-run -a pnpm test:e2e
