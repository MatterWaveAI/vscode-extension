# Gitleaks' own rules, as CI and the pre-commit hook run them, with one
# exception: values that name themselves as stand-ins are not secrets --
# the tests' keys all start with the fixed display prefix mw_abcdefgh, and
# others say test, example, dummy or fake.
[extend]
useDefault = true

[[allowlists]]
description = "Stand-in values in tests and examples"
regexTarget = "secret"
regexes = ['''(?i)(test|example|dummy|fake)''', '''^mw_abcdefgh''']
